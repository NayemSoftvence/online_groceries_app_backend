[build]
  publish = "public"
  command = "echo 'No build needed'"

[build.environment]
  NODE_ENV = "production"

[functions]
  directory = "netlify/functions"

# Redirect API routes to Netlify functions
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/auth/health"
  status = 200

# Serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200